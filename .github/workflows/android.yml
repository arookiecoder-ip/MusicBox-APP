name: Android CI

on:
  push:
    branches: [beta, main, feat/alexa-backend]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug APK
        run: sh ./gradlew testDebugUnitTest assembleDebug --stacktrace --no-daemon
      - name: Check release shrinking using optimized debug only
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[readiness]') }}
        run: |
          sh ./gradlew :app:assembleOptimizedDebug --no-daemon
          python3 scripts/verify_apk_components.py app/build/outputs/apk/optimizedDebug/app-optimizedDebug.apk
      - name: Preserve shrinking readiness mapping
        if: ${{ always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[readiness]') }}
        uses: actions/upload-artifact@v4
        with:
          name: optimized-debug-readiness
          path: |
            app/build/outputs/mapping/optimizedDebug/
            app/build/outputs/apk/optimizedDebug/
          if-no-files-found: warn
      - name: Upload JVM test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-tests
          path: app/build/test-results/testDebugUnitTest/
      - name: Upload review APK
        uses: actions/upload-artifact@v4
        with:
          name: music-box-review-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
