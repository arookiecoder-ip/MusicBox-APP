name: Migrate cached signing key (trusted one-off)

# Only ciphertext leaves this trusted job. Remove the sensitive cache after
# ANDROID_DEBUG_KEYSTORE_BASE64 has been configured and verified by a release.
on:
  workflow_dispatch:
    inputs:
      transport_public_key:
        description: Temporary RSA public key PEM used only to encrypt this migration
        type: string
        required: true

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restore existing signing identity
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/music-box-debug.keystore
          key: music-box-debug-signing-v1
          fail-on-cache-miss: true

      - name: Encrypt for the migration recipient
        env:
          TRANSPORT_PUBLIC_KEY: ${{ inputs.transport_public_key }}
        run: |
          set -eu
          umask 077
          trap 'rm -f transport-pass transport-public.pem "$HOME/.android/music-box-debug.keystore"' EXIT
          printf '%s\n' "$TRANSPORT_PUBLIC_KEY" > transport-public.pem
          openssl pkey -pubin -in transport-public.pem -noout
          openssl rand -base64 48 > transport-pass
          openssl enc -aes-256-cbc -pbkdf2 -salt -in "$HOME/.android/music-box-debug.keystore" -out keystore.enc -pass file:transport-pass
          openssl pkeyutl -encrypt -pubin -inkey transport-public.pem -in transport-pass -out transport-pass.enc -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256

      - name: Upload encrypted migration bundle
        uses: actions/upload-artifact@v4
        with:
          name: signing-migration-encrypted
          retention-days: 1
          path: |
            keystore.enc
            transport-pass.enc
